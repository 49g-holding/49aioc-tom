# Checks of this writing repository, on every pull request and on main.
# cards: the cards in cards/ are exactly what tools/make_cards.py generates from the blueprint,
#        and they validate against the schemas of 49GAION-protocol on main.
# contracts: every contract example is as expected (tools/check_contracts.py), with check 7 run
#            against the Human Floor signature list at the hub version pinned in contracts/PINS.json,
#            and check 11 against the Library's design return contract at the commit pinned there.
# no-persian: no Persian or Arabic-script character in any tracked file, the PR title or the PR body.
# no-org-names: the scanner of 49GAION-protocol finds no organisation name, host or 49-prefixed code.
name: checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the schemas of 49GAION-protocol (main)
        uses: actions/checkout@v4
        with:
          repository: 49g-holding/49GAION-protocol
          path: .deps/protocol
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2 jsonschema==4.23.0 referencing==0.35.1
      - name: Generate and check the cards
        run: python3 tools/make_cards.py .deps/protocol/spec/schemas
      - name: The committed cards are the generated cards
        run: git diff --exit-code -- cards
      - name: Read the pinned version of the Human Floor signature list
        id: pin
        run: echo "tag=$(python3 -c "import json; print(json.load(open('contracts/PINS.json'))['signature_list']['tag'])")" >> "$GITHUB_OUTPUT"
      - name: Check out the 49GAION hub at that version
        uses: actions/checkout@v4
        with:
          repository: 49g-holding/49GAION
          ref: ${{ steps.pin.outputs.tag }}
          path: .deps/hub
      - name: Read the pinned commit of the design return contract
        id: pin_return
        run: echo "commit=$(python3 -c "import json; print(json.load(open('contracts/PINS.json'))['design_return_contract']['commit'])")" >> "$GITHUB_OUTPUT"
      - name: Check out 49GAION-protocol at that commit
        uses: actions/checkout@v4
        with:
          repository: 49g-holding/49GAION-protocol
          ref: ${{ steps.pin_return.outputs.commit }}
          path: .deps/protocol-pin
      - name: Check the contracts (check 7 against the pinned signature list; check 11 against the pinned design return contract)
        run: python3 tools/check_contracts.py --signature-list .deps/hub/upstream/human-floor-signature-types.json --design-return .deps/protocol-pin/library/contracts/design-return.schema.json

  no-persian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked files, the PR title and the PR body
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess, sys
          pat = re.compile('[\u0600-\u06FF\uFB50-\uFDFF\uFE70-\uFEFF]')
          hits = []
          for f in subprocess.run(['git', 'ls-files'], capture_output=True, text=True, check=True).stdout.splitlines():
              try:
                  text = open(f, encoding='utf-8').read()
              except (UnicodeDecodeError, IsADirectoryError, FileNotFoundError):
                  continue
              hits += [f'{f}:{n}' for n, line in enumerate(text.splitlines(), 1) if pat.search(line)]
          for name in ('PR_TITLE', 'PR_BODY'):
              if pat.search(os.environ.get(name, '')):
                  hits.append(name)
          for h in hits:
              print(f'::error::Persian characters: {h}')
          sys.exit(1 if hits else 0)
          PY

  no-org-names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the scanner of 49GAION-protocol (main)
        uses: actions/checkout@v4
        with:
          repository: 49g-holding/49GAION-protocol
          path: .deps/protocol
      - name: Scan tracked files
        run: |
          hits=$(bash .deps/protocol/.github/scripts/no-org-names.sh | grep -v '^\.deps/' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::Organisation names, hosts or 49-prefixed codes found (listed above)."
            exit 1
          fi
